# ------------------------------------------------------------------
# Cada chave pode ser sobrescrita por -Dchave=valor ou pela env var
# equivalente em MAIÚSCULAS com "_" (ex.: base.url -> BASE_URL).
# ------------------------------------------------------------------
base.url=https://stg2.shop.samsung.com
site=pe
sku=RB45DG6300B1PE
quantity=1

browser=chromium
headless=true
# Viewport desktop: o recon foi feito em mobile; ambos funcionam com os locators usados.
viewport.width=1440
viewport.height=900
slow.mo=0

# Timeouts (ms) - o staging é lento e o Spartacus faz lazy-load por step
timeout.default=30000
timeout.assertion=20000
timeout.navigation=60000
timeout.place.order=90000

# Evidências
evidence.dir=target/evidence
trace.enabled=true
video.enabled=false

# Confirmação / Order Number - validados no stg2:
#   URL: /pe/orderConfirmation · texto: "¡Muchas gracias por tu compra!" · "Número de pedido: PE261119-78882474"
confirmation.url.regex=.*/orderConfirmation.*
confirmation.success.regex=gracias por tu compra
# o número é renderizado em elemento separado do rótulo "Número de pedido" -> casamos pelo formato
order.number.regex=(?<![A-Z0-9])([A-Z]{2,4}\\d{6}-\\d{6,})(?!\\d)
# Status de pedido considerado FALHA (o restante é aceito: CREATED, WAITING_FOR_SEND_FINANCIAL, ...)
order.status.failure.regex=.*(CANCEL|FAIL|REJECT|INVALID|NOT_AUTHORIZED|DECLINED).*
# Backend (SAP Commerce OCC) observado no trace:
mp.card.token.api.regex=.*api\\.mercadopago\\.com/v1/card_tokens.*
place.order.api.regex=.*/paymentmodes/[^/]+/submitOrder.*
order.details.api.regex=.*/users/current/orders/[^/?]+\\?.*fields=FULL.*

# Bloqueio de ruído de terceiros (pop-up Insider, analytics) - não bloqueia Mercado Pago
block.third.party=true
