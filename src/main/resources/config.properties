# ------------------------------------------------------------------
# Cada chave pode ser sobrescrita por -Dchave=valor ou pela env var
# equivalente em MAIÚSCULAS com "_" (ex.: base.url -> BASE_URL).
# ------------------------------------------------------------------
base.url=https://stg2.shop.samsung.com
site=pe
sku=RB45DG6300B1PE
quantity=1

browser=chromium
headless=true
# Viewport desktop: o recon foi feito em mobile; ambos funcionam com os locators usados.
viewport.width=1440
viewport.height=900
slow.mo=0

# Timeouts (ms) - o staging é lento e o Spartacus faz lazy-load por step
timeout.default=30000
timeout.navigation=60000
timeout.place.order=90000

# Evidências
evidence.dir=target/evidence
trace.enabled=true
video.enabled=false

# Confirmação / Order Number (regex) - NÃO validados no recon (pagamento travou no
# navegador de recon por causa dos iframes MP). Ajustar após o 1º run verde, se preciso.
confirmation.url.regex=(?i).*(order-?confirmation|orderconfirmation|checkout/confirmation|thank).*
confirmation.success.regex=(?i)(gracias|tu pedido|pedido (fue )?(realizado|confirmado|recibido)|order placed)
order.number.regex=(?i)(?:n[úu]mero de (?:pedido|orden)|pedido|orden|order)\\s*(?:n[°ºo.]*|#|:)?\\s*([A-Z]{0,4}\\d{6,})
# Chamada de place order capturada na rede (complemento API da validação)
place.order.api.regex=(?i).*(/orders(\\?|$)|placeorder|place-order|/order/place).*

# Bloqueio de ruído de terceiros (pop-up Insider, analytics) - não bloqueia Mercado Pago
block.third.party=true
